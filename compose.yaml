services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: yumstash
      POSTGRES_PASSWORD: yumstash
      POSTGRES_DB: yumstash
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yumstash -d yumstash"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
